# Demand assumptions for Larkfield's document assistant: what we expect people to do.
# Every value is a range [low, base, high]. Its evidence starts with "verified:" (we checked it,
# and the text says how) or "assumed:" (our best guess, and the text says why).
# Check the assumed values first: they are where the proposal is most likely to be wrong.

[settings]
days_per_month = 30
peak_hour_share = [0.10, 0.123, 0.20]   # share of an average day's questions in the busiest hour
peak_minute_factor = [3.0, 5.35, 8.0]   # the busiest minute's rate / the busiest hour's rate

[settings.evidence]
peak_hour_share = "verified: 0.123 is the busiest hour's share of an average day in the help desk's ticket workload (101 of 822 tickets; measured.toml: ticket_peak_hour_share), because the model multiplies an average day by it; the high value allows for a lunch-time rush"
peak_minute_factor = "verified: 5.35 is the busiest minute / the busiest hour in the same workload (measured.toml: ticket_peak_minute_factor)"

[tenants.larkfield]
name = "Larkfield"
joins_in_month = 0
staff_users = [8, 10, 12]
staff_questions_per_day = [10, 20, 40]
customers_per_day = [300, 800, 1600]
customer_questions_per_day = [1.0, 1.5, 3.0]
documents = [36, 36, 60]
words_per_document = [150, 181, 400]
document_changes_per_month = [4, 8, 20]
user_growth_per_month = [0.0, 0.02, 0.05]

[tenants.larkfield.evidence]
staff_users = "verified: Grace's help-desk rota has 10 agents; 8 to 12 with holidays and the busy season"
staff_questions_per_day = "assumed: Grace's estimate after a one-week trial; check it with the usage log in the first month"
customers_per_day = "assumed: about one asking customer per new ticket today (822 tickets a day); 0.4 to 2 times that"
customer_questions_per_day = "assumed: no data yet; a customer usually asks one question and a follow-up"
documents = "verified: 36 documents in the collection today; 60 if the product guides are added next year"
words_per_document = "verified: 181 words on average in today's collection (the RAG course's documents)"
document_changes_per_month = "assumed: Mei's estimate from last year's policy updates"
user_growth_per_month = "assumed: Omar's sales plan (2% a month); 5% if the assistant goes on the home page"

