# Continuous integration: check every change, then build one image per commit.
# Pull requests: checks and a test build (nothing is pushed).
# main and hotfix/*: checks, then build, smoke-test and push the image to
# GitHub Container Registry, with build evidence. A version tag does not build
# again: release.yml tags the image that this workflow built.
name: CI

on:
  pull_request:
  push:
    branches: [main, "hotfix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the exact versions
        run: python -m pip install -r requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Unit and contract tests
        run: python -m pytest --junitxml=reports/junit.xml
      - name: Security - known vulnerabilities in the image's packages
        run: pip-audit -r requirements-run.txt --progress-spinner off
      - name: Keep the test and evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/

  image:
    name: Build, smoke-test and push the image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read the version from pyproject.toml
        id: version
        run: python3 -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
      - name: Build (and keep it here for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ticket-api:candidate
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image before it leaves this runner
        run: |
          docker run -d --name candidate -p 127.0.0.1:8000:8000 -e API_KEY=ci-smoke-key ticket-api:candidate
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8000/health && break; sleep 1; done
          scripts/smoke.sh http://127.0.0.1:8000 ci-smoke-key
      - name: Sign in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the same build
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Record where the image came from
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write build-info.json
        if: env.PUSH == 'true'
        run: |
          mkdir -p evidence
          cat > evidence/build-info.json <<JSON
          {
            "image": "${IMAGE}",
            "digest": "${{ steps.push.outputs.digest }}",
            "tags": $(jq -c -R -s 'split("\n") | map(select(length > 0))' <<< "${{ steps.meta.outputs.tags }}"),
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          cat evidence/build-info.json
          {
            echo "### Image"
            echo "\`${IMAGE}@${{ steps.push.outputs.digest }}\`"
            echo "Commit \`${{ github.sha }}\`, tags: ${{ steps.meta.outputs.tags }}" | tr '\n' ' '
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the build evidence
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-info
          path: evidence/build-info.json
