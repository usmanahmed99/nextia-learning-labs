# A release: when a version tag (v1.2.0) is pushed, give the image that CI
# already built and tested for that commit its version tag, and create the
# GitHub release. Nothing is built again, so the release is the same digest
# that staging and production run.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image with the version
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          source="$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$source" > /dev/null || {
            echo "No image $source: CI must build and test this commit first."; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:$version" "$source"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${{ steps.tag.outputs.version }}.md"
          [ -f "$notes" ] || { echo "Write the release notes in $notes first."; exit 1; }
          {
            cat "$notes"
            echo
            echo "Image: \`$IMAGE@${{ steps.tag.outputs.digest }}\` (tag \`${{ steps.tag.outputs.version }}\`)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
